<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f9f9f9;
        color: #333;
        padding: 20px;
    }
    .container {
        background-color: #fff;
        padding: 20px;
        border-radius: 8px;
        max-width: 500px;
        margin: auto;
        box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }
    #btn {
        display: inline-block;
        background-color: #101210ff;
        color: white;
        padding: 12px 20px;
        border-radius: 5px;
        text-decoration: none;
        font-weight: bold;
    }
    #btn:hover {
        background-color: #ffffffff;
        color: #101210ff;
        border: 1px solid #101210ff;
    }
    .footer {
        font-size: 12px;
        color: #777;
        margin-top: 20px;
    }
</style>
</head>
<body>
<div class="container">
    <h2>Сброс пароля</h2>
    <p>Вы получили это письмо, потому что был отправлен запрос на сброс пароля для вашей учётной записи.</p>
    <p style="text-align:center;">
        <a href="{{ protocol }}://{{ domain }}{% url 'users:password_reset_confirm' uidb64=uid token=token %}" id="btn">Сбросить пароль</a>
    </p>
    <p>Если вы не запрашивали сброс пароля, просто проигнорируйте это письмо.</p>
</div>
</body>
</html>
